name: Build, Release and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Redeploy to Railway?'
        required: true
        type: boolean
        default: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run Automated Tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        run: ./mvnw clean test

  build-windows:
    runs-on: windows-latest
    needs: run-tests
    name: Build Native Image for Windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Windows Executable
        shell: cmd
        run: mvnw.cmd -Pnative native:compile -DskipTests "-Dnative.buildargs=-H:DeadlockWatchdogInterval=0"

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: target/urlcondenser.exe
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    name: Create GitHub Release
    permissions:
      contents: write

    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: ./

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: urlcondenser.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-railway:
    runs-on: ubuntu-latest
    needs: run-tests
    if: github.event_name == 'push' || inputs.deploy
    name: Deploy Linux Image to Railway
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build Native Linux Binary
        run: ./mvnw -Pnative native:compile -DskipTests

      - name: Downcase Repository Name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Trigger Redeploy on Railway
        run: railway redeploy --service 73ee020a-aa00-4129-ad4b-98839ad1025d -y
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
